{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<nav class="crumbs"><a href="{% url 'accounts:profile' %}">My profile</a><span>Change password</span></nav>
<header class="page-head"><h1>Change password</h1></header>
<form class="card narrow--sm" method="post" novalidate>
  <div class="card-body">
    {% csrf_token %}
    {% include "includes/form_fields.html" with layout="form-stack" %}
    <div class="form-actions">
      <button class="btn btn--primary" type="submit">Update password</button>
      <a class="btn btn--ghost" href="{% url 'accounts:profile' %}">Cancel</a>
    </div>
  </div>
</form>
{% endblock %}
