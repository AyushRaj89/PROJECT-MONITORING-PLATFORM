{% extends "base.html" %}
{% block title %}Password changed{% endblock %}
{% block content %}
<section class="card narrow--sm">
  <div class="empty">
    <span class="stat-ic stat-ic--green"><svg class="ic"><use href="#i-check"/></svg></span>
    <h3>Password updated</h3>
    <p>Use your new password the next time you log in.</p>
    <a class="btn btn--primary" href="{% url 'accounts:profile' %}">Back to profile</a>
  </div>
</section>
{% endblock %}
