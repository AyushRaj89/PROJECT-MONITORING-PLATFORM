{% extends "base.html" %}
{% block title %}Delete milestone{% endblock %}
{% block content %}
<nav class="crumbs"><a href="{% url 'projects:list' %}">Projects</a><a href="{{ project.get_absolute_url }}">{{ project.code }}</a><span>Delete milestone</span></nav>
<form class="card narrow--sm" method="post">
  <div class="card-body confirm">
    {% csrf_token %}
    <span class="ic-wrap"><svg class="ic"><use href="#i-trash"/></svg></span>
    <h1 style="font-size:20px">Delete "{{ milestone.title }}"?</h1>
    <p class="muted">Tasks linked to this milestone stay in the project but lose the link.</p>
    <div class="actions">
      <button class="btn btn--danger" type="submit">Delete milestone</button>
      <a class="btn btn--ghost" href="{{ project.get_absolute_url }}">Keep milestone</a>
    </div>
  </div>
</form>
{% endblock %}
