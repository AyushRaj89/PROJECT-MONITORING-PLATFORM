{% comment %}Round initials badge. Usage: include with u=<user> and optional size="sm" or "lg".{% endcomment %}<span class="avatar{% if size %} avatar--{{ size }}{% endif %}" style="--h: {{ u.pk|default:1 }}" aria-hidden="true">{% if u.first_name %}{{ u.first_name|slice:":1" }}{{ u.last_name|slice:":1" }}{% else %}{{ u.username|slice:":2" }}{% endif %}</span>
